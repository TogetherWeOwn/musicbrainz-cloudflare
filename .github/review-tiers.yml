# Highest matching tier wins; unmatched paths are sensitive. For renames,
# classify both the old and new paths. Regardless of path, escalate to
# sensitive for changes involving endpoints or input parsing; auth, sessions,
# crypto, keys, secrets, credentials or permissions; tenant or personal data;
# SQL, schema or migrations; dependencies or lockfiles (including dev deps);
# CI or workflows; or weakened/deleted tests, assertions or review gates.
# Inert prose and test names do not exempt content from these triggers.
version: 1
default_tier: sensitive
tiers:
  low:
    - README.md
  ordinary: []
  sensitive:
    - .github/review-tiers.yml
